name: Refresh demo prices

# Redeploys the hosted demo twice a week, so it shows recent prices.
# Optional: needs the RENDER_DEPLOY_HOOK secret (docs/demo.md); does nothing without it.
on:
  schedule:
    - cron: "0 1 * * 3,5"  # 06:45 NPT Wednesday and Friday: each build uses ~20 of the free plan's build minutes
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK is not set; nothing to do."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy started."
