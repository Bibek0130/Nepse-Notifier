<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Your NEPSE alerts</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --border:#e3e3de; --accent:#2a78d6; --ok:#1a7f37; --err:#c62828; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ececea; --muted:#9b9b95; --border:#33332f; --accent:#6aa8f0; --ok:#4caf6a; --err:#ef6b6b; } }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:520px; margin:40px auto; padding:0 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .muted { color:var(--muted); }
  form { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px; margin-top:20px; }
  .field { margin-bottom:18px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  .check label { display:flex; gap:8px; align-items:flex-start; font-weight:normal; }
  .check input { margin-top:3px; }
  textarea, select { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text); font:inherit; }
  .help { font-size:.85rem; color:var(--muted); margin-top:4px; }
  .errorlist { color:var(--err); margin:6px 0 0; padding:0; list-style:none; font-size:.9rem; }
  .saved { color:var(--ok); margin-top:16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; cursor:pointer; }
</style>
{% include "shared/busy_buttons.html" %}
</head>
<body>
<main>
  <h1>Your NEPSE alerts</h1>
  <div class="muted">For {{ email }}</div>
  {% if saved %}<p class="saved" role="status">Saved. Your next digest will use these settings.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="field">
      <label for="{{ form.watchlist.id_for_label }}">Watchlist</label>
      {{ form.watchlist }}
      <div class="help">{{ form.watchlist.help_text }}</div>
      {{ form.watchlist.errors }}
    </div>
    <div class="field check"><label>{{ form.include_intraday }} {{ form.include_intraday.label }}</label></div>
    <div class="field check"><label>{{ form.is_active }} {{ form.is_active.label }}</label></div>
    <button type="submit">Save</button>
  </form>
</main>
</body>
</html>
